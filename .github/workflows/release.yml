name: Release

# A release of xek is cut by tagging — `git tag -s X.Y.Z && git push --tags` — as every other
# repository's is, and runs the same script: propensive/.github's release.sh, through etc/shared
# at the commit pinned in etc/github-ref, configured by etc/release. It gates on a verified signed
# tag, on CI already green on the tagged commit and on no release of that version existing;
# assembles the assets with etc/ci/client-assemble.sh; uploads them to a draft, checks every
# digest and publishes; then records the hashes in a pull request here (etc/ci/client-record.sh)
# and proposes the release to the repositories in etc/downstream. If anything fails before it is
# published, the release and the tag are deleted, and the retry is
# `git tag -d X.Y.Z && git tag -s X.Y.Z && git push --tags`.
#
# What differs from the other repositories is only what is built, and so where: the client stubs
# are cross-compiled for five platforms with the pinned nightly and cargo-zigbuild on macOS, where
# they have always been built, and where Apple's `codesign` ad-hoc signs the macOS stubs.

on:
  push:
    tags: ['[0-9]*']
  # A rehearsal on GitHub's own machines, publishing nothing: every gate that can run before the tag
  # exists, the whole build, the notes and the pull requests it would open, as RELEASE_DRY_RUN=1.
  workflow_dispatch:
    inputs:
      version:
        description: The version to rehearse, as X.Y.Z — the tag
        required: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write        # the release and its assets, the record branch, and on failure the tag
      pull-requests: write   # the record pull request, when there is no PROPAGATE_TOKEN
    steps:
      # The whole history and every tag: the notes run from the previous release's tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # release.sh needs bash 4 or later (associative arrays, `mapfile`); macOS ships 3.2.
      - name: Install the build tools
        run: |
          brew install bash zig cargo-zigbuild
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # The nightly, `rust-src` and the five targets that rust-toolchain.toml names.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # PROPAGATE_TOKEN (optional) writes to other repositories — see propensive/.github's README;
      # the job's own token reaches only this one.
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
        run: ./etc/shared release.sh

      - name: Rehearse the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: "1"
          VERSION: ${{ inputs.version }}
        run: ./etc/shared release.sh "$VERSION"
